<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melty Feedback Page — Full Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cream: #F8F3ED;
    --cream-warm: #F5EDE3;
    --cream-deep: #EDE5DA;
    --chocolate: #4A2C1A;
    --chocolate-light: #6B4832;
    --caramel: #8B6347;
    --gold: #C9994A;
    --orange: #E85A24;
    --latte: #D4C4B5;
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-sans: 'Nunito', sans-serif;
  }

  body {
    background: var(--cream);
    color: var(--chocolate);
    font-family: var(--font-sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* === HEADER MOCK === */
  .mock-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(248,243,237,0.92);
    backdrop-filter: blur(12px);
    padding: 16px 40px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(212,196,181,0.3);
  }
  .mock-header .logo {
    font-family: var(--font-serif); font-size: 24px; font-weight: 600;
    color: var(--chocolate); font-style: italic;
  }
  .mock-header nav { display: flex; gap: 28px; }
  .mock-header nav a {
    font-family: var(--font-sans); font-size: 13px; color: var(--caramel);
    text-decoration: none; letter-spacing: 1px; text-transform: uppercase;
  }
  .mock-header nav a.active { color: var(--chocolate); font-weight: 600; }

  /* === HERO SECTION (full width) === */
  .feedback-hero {
    margin-top: 60px;
    padding: clamp(4rem, 10vw, 7rem) clamp(1.5rem, 6vw, 5rem) clamp(2rem, 5vw, 3rem);
    text-align: center;
    position: relative;
    background: linear-gradient(180deg, var(--cream) 0%, var(--cream-warm) 100%);
  }
  .feedback-hero::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent 10%, var(--latte) 50%, transparent 90%);
  }
  .feedback-hero .logo-circle {
    width: 70px; height: 70px; border-radius: 50%;
    background: linear-gradient(135deg, #5C3D2E, var(--chocolate-light));
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    box-shadow: 0 6px 20px rgba(74,44,26,0.15);
  }
  .feedback-hero .logo-circle span {
    color: var(--cream); font-family: var(--font-serif); font-style: italic;
    font-size: 30px; font-weight: 300;
  }
  .feedback-hero h1 {
    font-family: var(--font-serif); font-weight: 400; font-size: clamp(2rem, 5vw, 3.2rem);
    color: var(--chocolate); letter-spacing: 0.05em; margin-bottom: 12px;
  }
  .feedback-hero .subtitle {
    font-family: var(--font-serif); font-style: italic; font-size: clamp(1rem, 2.5vw, 1.2rem);
    color: var(--caramel); font-weight: 300;
  }
  .feedback-hero .divider {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-top: 20px;
  }
  .feedback-hero .divider-line { width: 40px; height: 1px; background: var(--latte); }
  .feedback-hero .divider-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }

  /* === FORM SECTION (full width with arch) === */
  .feedback-form-section {
    padding: clamp(3rem, 8vw, 5rem) clamp(1.5rem, 6vw, 5rem);
    display: flex; justify-content: center;
    position: relative;
    background: linear-gradient(180deg, var(--cream-warm) 0%, var(--cream-deep) 100%);
  }

  .arch-frame {
    position: relative;
    width: 100%; max-width: 580px;
    padding: 50px 40px 40px;
  }
  .arch-frame::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border: 1.5px solid rgba(139,99,71,0.12);
    border-radius: 280px 280px 16px 16px;
    pointer-events: none;
  }

  /* Floating dots */
  .float-dot {
    position: absolute; border-radius: 50%; pointer-events: none;
    animation: floatDot 6s ease-in-out infinite;
  }
  .float-dot-1 { width: 6px; height: 6px; background: var(--gold); opacity: 0.3; top: 15%; left: 5%; animation-delay: 0s; }
  .float-dot-2 { width: 4px; height: 4px; background: var(--orange); opacity: 0.25; top: 40%; right: 8%; animation-delay: 2s; }
  .float-dot-3 { width: 5px; height: 5px; background: var(--gold); opacity: 0.2; bottom: 20%; left: 10%; animation-delay: 4s; }
  @keyframes floatDot {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(8px, -12px); }
  }

  /* Star Rating */
  .star-rating { display: flex; justify-content: center; gap: 12px; margin-bottom: 12px; }
  .star {
    font-size: 40px; cursor: pointer; transition: all 0.25s ease;
    color: var(--latte); line-height: 1;
    font-family: var(--font-serif);
  }
  .star.active { color: var(--gold); filter: drop-shadow(0 0 8px rgba(201,153,74,0.35)); }
  .star:hover { transform: scale(1.15); }

  .rating-label {
    text-align: center; font-family: var(--font-serif); font-style: italic;
    color: var(--caramel); font-size: 15px; min-height: 22px; margin-bottom: 28px;
    transition: opacity 0.3s ease;
  }

  /* Form fields */
  .form-group { margin-bottom: 20px; width: 100%; }
  .form-group label {
    display: block; font-family: var(--font-sans); font-size: 11px;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--caramel);
    margin-bottom: 8px; font-weight: 600;
  }
  textarea, input[type="text"] {
    width: 100%; padding: 16px 20px;
    background: rgba(255,255,255,0.65);
    border: 1.5px solid var(--latte);
    border-radius: 12px;
    font-family: var(--font-sans); font-size: 15px; color: var(--chocolate);
    transition: all 0.3s ease;
    outline: none;
    resize: vertical;
  }
  textarea:focus, input[type="text"]:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,153,74,0.12), 0 4px 12px rgba(74,44,26,0.06);
    background: rgba(255,255,255,0.85);
  }
  textarea::placeholder, input::placeholder {
    font-family: var(--font-serif); font-style: italic; color: var(--latte);
  }
  textarea { min-height: 120px; }

  .optional-hint {
    font-size: 11px; color: var(--latte); font-style: italic; margin-left: 4px;
    font-weight: 300; text-transform: none; letter-spacing: 0;
  }

  /* Submit button */
  .submit-btn {
    display: block; width: 100%; padding: 16px;
    background: linear-gradient(135deg, var(--chocolate), var(--chocolate-light));
    color: var(--cream); border: none; border-radius: 16px;
    font-family: var(--font-serif); font-size: 15px; letter-spacing: 3px;
    text-transform: uppercase; cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 16px rgba(74,44,26,0.18);
    margin-top: 8px;
  }
  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(74,44,26,0.24);
  }
  .submit-btn .star-accent { opacity: 0.6; margin-left: 8px; }

  /* === SUCCESS STATE === */
  .success-overlay {
    display: none; /* shown on submit */
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(248,243,237,0.96);
    z-index: 200;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 20px;
  }
  .success-overlay.visible { display: flex; }
  .success-check {
    width: 80px; height: 80px;
  }
  .success-check circle { fill: none; stroke: var(--gold); stroke-width: 2; }
  .success-check path {
    fill: none; stroke: var(--gold); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 50; stroke-dashoffset: 50;
    animation: drawCheck 0.6s ease 0.3s forwards;
  }
  @keyframes drawCheck {
    to { stroke-dashoffset: 0; }
  }
  .success-text {
    font-family: var(--font-serif); font-size: 28px; color: var(--chocolate);
    letter-spacing: 0.03em;
  }
  .success-sub {
    font-family: var(--font-serif); font-style: italic; color: var(--caramel);
    font-size: 16px;
  }
  .success-link {
    margin-top: 16px; padding: 12px 32px;
    border: 1.5px solid var(--chocolate); border-radius: 20px;
    color: var(--chocolate); text-decoration: none;
    font-family: var(--font-sans); font-size: 13px; letter-spacing: 1px;
    transition: all 0.3s ease;
  }
  .success-link:hover { background: var(--chocolate); color: var(--cream); }

  /* Falling particles */
  .particle {
    position: fixed; pointer-events: none; z-index: 201;
    font-size: 16px; opacity: 0;
  }
  @keyframes fall {
    0% { opacity: 1; transform: translateY(-20px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(360deg); }
  }

  /* === FOOTER MOCK === */
  .mock-footer {
    background: #3D251A; padding: 40px;
    text-align: center; color: var(--latte);
    font-family: var(--font-sans); font-size: 13px;
  }

  /* Annotation labels */
  .annotation {
    position: absolute; font-size: 10px; font-family: monospace;
    background: #E85A24; color: white; padding: 2px 8px; border-radius: 4px;
    z-index: 50; white-space: nowrap;
  }

  /* Demo indicator */
  .demo-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(74,44,26,0.9); color: var(--cream);
    text-align: center; padding: 8px; font-size: 11px;
    font-family: var(--font-sans); z-index: 300; letter-spacing: 1px;
  }
  .demo-bar button {
    background: var(--gold); color: var(--chocolate); border: none;
    padding: 4px 12px; border-radius: 8px; margin-left: 12px;
    cursor: pointer; font-size: 11px; font-family: var(--font-sans);
  }
</style>
</head>
<body>

<!-- Header -->
<div class="mock-header">
  <div class="logo">Melty</div>
  <nav>
    <a href="#">Главная</a>
    <a href="#">Меню</a>
    <a href="#" class="active">Отзыв</a>
    <a href="#">О нас</a>
  </nav>
</div>

<!-- Hero Section -->
<section class="feedback-hero">
  <div class="logo-circle">
    <span>M</span>
  </div>
  <h1>Оставьте отзыв</h1>
  <p class="subtitle">Ваше мнение делает нас лучше</p>
  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-dot"></div>
    <div class="divider-line"></div>
  </div>
</section>

<!-- Form Section -->
<section class="feedback-form-section">
  <div class="float-dot float-dot-1"></div>
  <div class="float-dot float-dot-2"></div>
  <div class="float-dot float-dot-3"></div>

  <div class="arch-frame">
    <!-- Star Rating -->
    <div class="star-rating" id="starRating">
      <span class="star active" data-value="1" onclick="setRating(1)">★</span>
      <span class="star active" data-value="2" onclick="setRating(2)">★</span>
      <span class="star active" data-value="3" onclick="setRating(3)">★</span>
      <span class="star active" data-value="4" onclick="setRating(4)">★</span>
      <span class="star" data-value="5" onclick="setRating(5)">★</span>
    </div>
    <div class="rating-label" id="ratingLabel">Хорошо</div>

    <!-- Textarea -->
    <div class="form-group">
      <label>Ваш отзыв</label>
      <textarea placeholder="Расскажите о вашем впечатлении..."></textarea>
    </div>

    <!-- Contact Info -->
    <div class="form-group">
      <label>Контакт <span class="optional-hint">(необязательно)</span></label>
      <input type="text" placeholder="Телефон, Telegram или email">
    </div>

    <!-- Submit -->
    <button class="submit-btn" onclick="showSuccess()">
      Отправить<span class="star-accent">✦</span>
    </button>
  </div>
</section>

<!-- Footer mock -->
<div class="mock-footer">
  Melty © 2024 — Мир вкуса и уюта
</div>

<!-- Success Overlay -->
<div class="success-overlay" id="successOverlay">
  <svg class="success-check" viewBox="0 0 80 80">
    <circle cx="40" cy="40" r="36" />
    <path d="M24 42 L34 52 L56 30" />
  </svg>
  <div class="success-text">Спасибо за ваш отзыв!</div>
  <div class="success-sub">Мы ценим каждое мнение 🤎</div>
  <a href="#" class="success-link" onclick="hideSuccess(); return false;">Вернуться на главную</a>
</div>

<!-- Demo Bar -->
<div class="demo-bar">
  MOCKUP — Interactive Demo (click stars, type, submit)
  <button onclick="showSuccess()">Preview Success State</button>
  <button onclick="hideSuccess()">Reset</button>
</div>

<script>
  const labels = ['', 'Ужасно', 'Плохо', 'Нормально', 'Хорошо', 'Отлично!'];
  let currentRating = 4;

  function setRating(value) {
    currentRating = value;
    const stars = document.querySelectorAll('.star');
    stars.forEach((star, i) => {
      star.classList.toggle('active', i < value);
    });
    document.getElementById('ratingLabel').textContent = labels[value] || '';
  }

  // Hover preview
  document.querySelectorAll('.star').forEach(star => {
    star.addEventListener('mouseenter', () => {
      const val = parseInt(star.dataset.value);
      document.querySelectorAll('.star').forEach((s, i) => {
        s.style.color = i < val ? 'var(--gold)' : 'var(--latte)';
      });
      document.getElementById('ratingLabel').textContent = labels[val];
    });
    star.addEventListener('mouseleave', () => {
      document.querySelectorAll('.star').forEach((s, i) => {
        s.style.color = '';
        s.classList.toggle('active', i < currentRating);
      });
      document.getElementById('ratingLabel').textContent = labels[currentRating];
    });
  });

  function showSuccess() {
    document.getElementById('successOverlay').classList.add('visible');
    // Spawn particles
    const emojis = ['✦', '🤎', '☕', '✦', '★', '✦'];
    for (let i = 0; i < 12; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = emojis[i % emojis.length];
      p.style.left = Math.random() * 100 + 'vw';
      p.style.top = '-20px';
      p.style.animation = `fall ${2 + Math.random() * 2}s ease ${Math.random() * 0.8}s forwards`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 4000);
    }
  }

  function hideSuccess() {
    document.getElementById('successOverlay').classList.remove('visible');
  }
</script>
</body>
</html>
