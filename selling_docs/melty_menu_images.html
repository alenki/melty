items.forEach(([name, url], i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <a href="${url}" target="_blank"><img src="${url}" alt="${name}" loading="lazy"></a>
    <div class="card-info">
      <div class="num">#${i+1}</div>
      <h3>${name}</h3>
      <a href="${url}" target="_blank" class="btn-open">Открыть ↗</a>
    </div>
  `;
  grid.appendChild(card);
});

function openAll() {
  if (confirm('Открыть все 100 изображений в новых вкладках?')) {
    items.forEach(([_, url]) => window.open(url, '_blank'));
  }
}

function copyAllLinks() {
  const text = items.map(([name, url]) => `${name}\n${url}`).join('\n\n');
  navigator.clipboard.writeText(text).then(() => alert('Все ссылки скопированы!'));
}
